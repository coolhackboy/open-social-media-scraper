name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please never paste your API key. The "Copy as" snippets in the app never contain it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint
      description: The endpoint id, if the bug is about a request (e.g. `tiktok/profiles`).
  - type: textarea
    id: request
    attributes:
      label: Request / error message
      description: Paste the "Copy as cURL" snippet and the error shown in the app (task ids are fine to share).
      render: shell
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 on macOS 15
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How are you running it?
      options:
        - npm run dev
        - Demo mode (?mock=1)
        - Self-hosted build (Vercel, Netlify, GitHub Pages, static host…)
        - Other
